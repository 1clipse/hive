name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Publishing must finish even when another tag is pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compat:cli:report
      - name: Verify release tag
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = require('./package.json')
          const tag = process.env.GITHUB_REF_NAME
          const expected = `v${pkg.version}`

          if (tag !== expected) {
            throw new Error(`Release tag ${tag} does not match package version ${expected}`)
          }

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          if (!changelog.includes(`## ${pkg.version} -`)) {
            throw new Error(`CHANGELOG.md is missing an entry for ${pkg.version}`)
          }
          NODE
      - run: pnpm check
      - run: pnpm build
      - run: pnpm pack:check
      - name: Pack release tarball
        id: pack
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { appendFileSync } = require('node:fs')

          const packed = JSON.parse(
            execFileSync('npm', ['pack', '--json'], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'inherit'],
            })
          )
          const packs = Array.isArray(packed) ? packed : packed.filename ? [packed] : Object.values(packed)
          if (packs.length !== 1 || packs[0]?.name !== '@tt-a1i/hive' || !packs[0]?.filename) {
            throw new Error('Expected exactly one Hive release tarball')
          }
          const [pack] = packs
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${pack.filename}\n`)
          NODE
      - name: Verify the exact release tarball
        run: node scripts/pack-smoke.mjs --tarball "${{ steps.pack.outputs.filename }}"
      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: hive-release-tarball-${{ github.ref_name }}
          path: ${{ steps.pack.outputs.filename }}
          if-no-files-found: error

  gateway-bundle:
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_GATEWAY_BUNDLE == 'true'
    needs: release-smoke
    continue-on-error: true
    runs-on: ubuntu-latest
    environment: gateway-production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = require('./package.json')
          const tag = process.env.GITHUB_REF_NAME
          const expected = `v${pkg.version}`

          if (tag !== expected) {
            throw new Error(`Release tag ${tag} does not match package version ${expected}`)
          }

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          if (!changelog.includes(`## ${pkg.version} -`)) {
            throw new Error(`CHANGELOG.md is missing an entry for ${pkg.version}`)
          }
          NODE
      - run: pnpm build:web

      - name: Ship gateway bundle
        id: bundle
        env:
          ASSETS_R2_BUCKET: ${{ vars.ASSETS_R2_BUCKET }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          SHIP_ARGS=(
            --dist web/dist
            --version "$VERSION"
            --out gateway/src/bundle-manifest.generated.ts
            --plan web/dist/r2-upload-plan.json
          )
          if [ -z "${ASSETS_R2_BUCKET:-}" ]; then
            SHIP_ARGS+=(--bake)
            echo "ASSETS_R2_BUCKET is unset; baking bundle bytes into the worker for Plan B."
          else
            echo "ASSETS_R2_BUCKET is set; shipping bundle bytes to R2 after deploy."
          fi
          node gateway/scripts/ship-bundle.mjs "${SHIP_ARGS[@]}"

      - name: Upload gateway bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: hive-web-bundle-${{ steps.bundle.outputs.version }}
          path: |
            web/dist
            gateway/src/bundle-manifest.generated.ts
            gateway/src/bundle-assets.generated.ts
          if-no-files-found: error
          retention-days: 90

      - name: Check gateway deploy credentials
        id: gateway_credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare credentials are not configured; skipping remote gateway deploy for this release."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against unconfigured gateway database_id
        if: steps.gateway_credentials.outputs.configured == 'true'
        working-directory: gateway
        run: |
          if grep -q 'placeholder-set-after-wrangler-d1-create' wrangler.toml; then
            echo "::error::wrangler.toml still has the placeholder database_id. Run 'wrangler d1 create hive-gateway' first (see docs/deploy-runbook.md)."
            exit 1
          fi

      - name: Apply gateway D1 migrations
        if: steps.gateway_credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gateway
          command: d1 migrations apply hive-gateway --remote

      - name: Deploy gateway worker
        if: steps.gateway_credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gateway
          command: deploy

      - name: Push gateway bundle bytes to R2
        if: steps.gateway_credentials.outputs.configured == 'true' && vars.ASSETS_R2_BUCKET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.ASSETS_R2_BUCKET }}
        run: |
          node -e '
            const plan = require("./web/dist/r2-upload-plan.json");
            for (const f of plan.files) {
              process.stdout.write(`${f.file}\t${f.key}\t${f.contentType}\n`);
            }
          ' | while IFS=$'\t' read -r FILE KEY CT; do
            npx --yes wrangler@4 r2 object put \
              "$BUCKET/$KEY" \
              --file "web/dist/$FILE" \
              --content-type "$CT" \
              --remote
          done

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hive-release-tarball-${{ github.ref_name }}
          path: release-package
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Print publish toolchain
        run: |
          node --version
          npm --version
      - run: npm publish ./release-package/*.tgz --access public --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
