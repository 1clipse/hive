name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete compatibility matrix
        type: boolean
        default: true
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.plan.outputs.code }}
      full: ${{ steps.plan.outputs.full }}
      native: ${{ steps.plan.outputs.native }}
      extended: ${{ steps.plan.outputs.extended }}
      inputs: ${{ steps.plan.outputs.inputs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_FULL: ${{ github.event_name == 'schedule' || inputs.full }}
        run: |
          if [ -z "$CI_BASE_SHA" ]; then
            export CI_BASE_SHA="$(git rev-parse HEAD^)"
          fi
          node scripts/ci-plan.mjs

  verify:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Run affected tests or the high-risk full suite
        env:
          CI_FULL: ${{ needs.plan.outputs.full }}
          CI_TEST_INPUTS: ${{ needs.plan.outputs.inputs }}
        run: node scripts/ci-plan.mjs --run
      - name: Pack once for all platforms
        if: needs.plan.outputs.native == 'true'
        run: |
          mkdir -p ci-package
          npm pack --pack-destination ci-package
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.native == 'true'
        with:
          name: hive-ci-package
          path: ci-package/*.tgz
          if-no-files-found: error
          retention-days: 3

  platforms:
    needs: [plan, verify]
    if: needs.plan.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.18.0', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g npm@12
        if: matrix.node == '26'
      - uses: actions/download-artifact@v4
        with:
          name: hive-ci-package
          path: ci-package
      - name: Verify the same package with both install policies
        shell: bash
        run: |
          node scripts/pack-smoke.mjs --tarball ci-package/*.tgz
          node scripts/pack-smoke.mjs --tarball ci-package/*.tgz --default-install
      - name: Reuse the build for platform lifecycle regressions
        if: needs.plan.outputs.extended != 'true'
        shell: bash
        run: |
          tar -xf ci-package/*.tgz
          cp -R package/dist .
          mkdir -p web
          cp -R package/web/dist web/
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/run-tests.mjs tests/cli/hive-update-preflight.test.ts tests/unit/windows-command-line.test.ts tests/unit/runtime-database.test.ts tests/server/agent-manager-windows-stop-real.test.ts tests/server/agent-manager-pty-eof.test.ts --testTimeout=60000 --hookTimeout=60000

  extended:
    needs: [plan, verify]
    if: needs.plan.outputs.extended == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.18.0', '26']
        exclude:
          # Already covered by verify, without repeating a full suite.
          - os: ubuntu-latest
            node: '22.18.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: hive-ci-package
          path: ci-package
      - name: Reuse the verified build
        shell: bash
        run: |
          tar -xf ci-package/*.tgz
          cp -R package/dist .
          mkdir -p web
          cp -R package/web/dist web/
      - run: node scripts/run-tests.mjs --no-file-parallelism --maxWorkers=1 --testTimeout=60000 --hookTimeout=60000 --exclude=tests/integration/package-tarball.test.ts
        if: runner.os != 'Windows'
      - run: pnpm test:windows
        if: runner.os == 'Windows'

  result:
    if: always()
    needs: [plan, verify, platforms, extended]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = Object.values(JSON.parse(process.env.RESULTS)); if (jobs.some(j => !["success", "skipped"].includes(j.result))) process.exit(1)'
