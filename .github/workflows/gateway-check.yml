name: Gateway CI

on:
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-check.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: gateway/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
